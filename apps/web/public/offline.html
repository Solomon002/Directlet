<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174A9D" />
    <title>DirectLet · No connection</title>
    <style>
      /* Self-contained on purpose: this page must work with no network at all. */
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b295b;
        color: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main { max-width: 360px; }
      img { width: 88px; height: 88px; border-radius: 20px; }
      h1 { font-size: 26px; margin: 20px 0 8px; }
      p { margin: 0 0 24px; line-height: 1.5; color: #c9d6ee; }
      button {
        font: inherit;
        font-weight: 700;
        padding: 14px 28px;
        border: 0;
        border-radius: 12px;
        background: #1db954;
        color: #0b295b;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>No connection</h1>
      <p>DirectLet needs the internet to show you flats and messages. Check your data or Wi-Fi, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
